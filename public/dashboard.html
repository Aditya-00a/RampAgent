<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · RampAgent</title>
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
.page{max-width:var(--maxw);margin:0 auto;padding:2rem 1.5rem 4rem}
/* page header */
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.4rem}
.phead h1{font-size:1.9rem;font-weight:800}
.phead .sub{color:var(--muted);font-size:.95rem;margin-top:.2rem}
.phead-right{display:flex;align-items:center;gap:.6rem}
.status{display:inline-flex;align-items:center;gap:.45rem;background:var(--green-soft);color:var(--green);
  font-size:.8rem;font-weight:700;padding:.45rem .85rem;border-radius:var(--r-pill);border:1px solid #cdeed8}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.18)}
.period{display:inline-flex;align-items:center;gap:.45rem;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r-pill);padding:.45rem .9rem;font-size:.82rem;font-weight:600}
.period svg{width:14px;height:14px;stroke:var(--muted);stroke-width:1.9;fill:none}

/* tabs */
.tabbar{display:flex;gap:.3rem;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-pill);
  padding:.3rem;width:fit-content;margin-bottom:1.8rem;flex-wrap:wrap}
.tabbtn{font-family:inherit;font-size:.88rem;font-weight:700;color:var(--muted);background:none;border:none;cursor:pointer;
  padding:.5rem 1.1rem;border-radius:var(--r-pill);transition:all .15s}
.tabbtn:hover{color:var(--ink)}
.tabbtn.active{background:var(--ink);color:#fff}
.tabpane{display:none}
.tabpane.active{display:block;animation:fade .25s ease}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;margin-bottom:1.6rem}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:1.2rem 1.3rem;box-shadow:var(--shadow);
  transition:transform .18s,box-shadow .18s}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.kpi .l{display:flex;align-items:center;gap:.45rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);font-weight:700}
.kpi .l .ic{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi .l .ic svg{width:13px;height:13px;stroke-width:2;fill:none}
.ic-ink{background:var(--paper-2)}.ic-ink svg{stroke:var(--ink)}
.ic-red{background:var(--red-soft)}.ic-red svg{stroke:var(--red)}
.ic-amber{background:var(--amber-soft)}.ic-amber svg{stroke:var(--amber)}
.ic-lime{background:var(--lime-soft)}.ic-lime svg{stroke:var(--lime-deep)}
.kpi .v{font-size:1.7rem;font-weight:800;letter-spacing:-.03em;margin-top:.6rem}
.kpi .d{font-size:.76rem;font-weight:700;margin-top:.3rem;display:flex;align-items:center;gap:.25rem}
.d-red{color:var(--red)}.d-green{color:var(--green)}.d-muted{color:var(--muted)}

/* panels grid */
.grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:1.2rem;margin-bottom:1.2rem}
.grid-1{margin-bottom:1.2rem}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel-h{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.4rem .4rem}
.panel-h h3{font-size:1rem;font-weight:700}
.panel-h .hint{font-size:.78rem;color:var(--dim)}
.panel-b{padding:.6rem 1.4rem 1.3rem}
.panel-desc{font-size:.78rem;color:var(--muted);margin:-.1rem 0 .9rem}

/* KRI list */
.kri{display:flex;align-items:center;justify-content:space-between;padding:.65rem 0;border-bottom:1px solid var(--line-2)}
.kri:last-child{border-bottom:none}
.kri .l{display:flex;align-items:center;gap:.6rem;min-width:0}
.kri .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.kri .dot.RED{background:var(--red)}.kri .dot.AMBER{background:var(--amber)}.kri .dot.GREEN{background:var(--green)}
.kri .nm{font-size:.82rem;font-weight:600}.kri .dt{font-size:.7rem;color:var(--dim)}
.kri .rv{text-align:right;flex-shrink:0}
.kri .val{font-size:.95rem;font-weight:800}
.kri .val.RED{color:var(--red)}.kri .val.AMBER{color:var(--amber)}.kri .val.GREEN{color:var(--green)}

/* item cells */
.cell-item{display:flex;align-items:center;gap:.6rem;font-weight:600}
.item-ic{width:28px;height:28px;border-radius:8px;background:var(--paper-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;color:var(--muted);flex-shrink:0}
.btn-act{font-family:inherit;font-size:.74rem;font-weight:700;padding:.4rem .8rem;border-radius:var(--r-pill);cursor:pointer;border:1px solid}
.btn-block{border-color:#f2c4c4;color:var(--red);background:var(--paper)}.btn-block:hover{background:var(--red-soft)}
.btn-review{border-color:var(--line);color:var(--ink);background:var(--paper)}.btn-review:hover{background:var(--paper-2)}

/* mini stats */
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.2rem}
.mini .m{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.3rem;box-shadow:var(--shadow)}
.mini .m .v{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.mini .m .l{color:var(--muted);font-size:.82rem;margin-top:.1rem}

/* queue */
.queue .q{display:flex;align-items:center;gap:.8rem;padding:.85rem 0;border-bottom:1px solid var(--line-2)}
.queue .q:last-child{border-bottom:none}
.q .av{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.82rem;flex-shrink:0}
.q .main{flex:1;min-width:0}.q .nm{font-weight:700;font-size:.88rem}.q .me{font-size:.76rem;color:var(--muted)}
.q .amt{font-weight:800;font-size:.9rem;text-align:right}

/* event log */
.ev-ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ev-ic svg{width:14px;height:14px;stroke-width:2;fill:none}
.ev{display:flex;align-items:center;gap:.6rem;font-weight:600}

/* chat */
.chat-row{display:flex;gap:.6rem}
.chat-input{flex:1;border:1px solid var(--line);background:var(--paper-2);border-radius:var(--r-pill);padding:.7rem 1.1rem;
  font-family:inherit;font-size:.9rem;outline:none}
.chat-input:focus{border-color:var(--lime-deep);background:var(--paper);box-shadow:0 0 0 3px rgba(196,240,47,.22)}
.chat-resp{margin-top:1rem;padding:1rem 1.2rem;background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--r);
  font-size:.88rem;line-height:1.6;display:none}
.suggest{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
.suggest button{font-family:inherit;font-size:.78rem;font-weight:600;color:var(--muted);background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r-pill);padding:.4rem .85rem;cursor:pointer}
.suggest button:hover{border-color:var(--ink);color:var(--ink)}

/* live monitor */
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;margin-left:.45rem;
  animation:pulse 1.2s ease infinite;vertical-align:1px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.4)}70%{box-shadow:0 0 0 7px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
.feed{min-height:420px}
.feed-card{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.8rem .9rem;margin-bottom:.55rem;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;animation:slideIn .3s ease;transition:opacity .4s,border-color .3s,background .3s}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.feed-card.flagged{border-color:#f2c4c4;background:#fffbfb;cursor:pointer}
.feed-card.flagged:hover{border-color:var(--red)}
.feed-card.injected{border-color:var(--lime-deep);box-shadow:0 0 0 3px rgba(196,240,47,.25)}
.feed-card.gone{opacity:0}
.fc-left{display:flex;align-items:center;gap:.6rem;min-width:0}
.fc-vendor{font-weight:700;font-size:.86rem}.fc-meta{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-right{text-align:right;flex-shrink:0}.fc-amt{font-weight:800;font-size:.9rem}
.fc-status{font-size:.72rem;font-weight:700;margin-top:.2rem;display:flex;align-items:center;gap:.35rem;justify-content:flex-end;color:var(--muted)}
.fc-reason{font-size:.7rem;color:var(--red);margin-top:.15rem;max-width:230px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spin-sm{width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.live-stat{display:flex;justify-content:space-between;align-items:baseline;padding:.6rem 0;border-bottom:1px solid var(--line-2)}
.live-stat:last-child{border:none}
.live-stat .k{font-size:.8rem;color:var(--muted);font-weight:600}
.live-stat .n{font-size:1.25rem;font-weight:800;transition:transform .15s}
.live-stat .n.bump{transform:scale(1.18)}
.inject-btn{display:flex;align-items:flex-start;gap:.6rem;width:100%;text-align:left;font-family:inherit;background:var(--paper);
  border:1px solid var(--line);border-radius:12px;padding:.75rem .9rem;cursor:pointer;margin-bottom:.55rem;transition:border-color .15s,transform .15s}
.inject-btn:hover{border-color:var(--ink);transform:translateY(-1px)}
.inject-btn:disabled{opacity:.45;cursor:default;transform:none}
.inject-btn .t{font-weight:700;font-size:.84rem}.inject-btn .d{font-size:.72rem;color:var(--muted);margin-top:.1rem}
.inject-btn .em{font-size:1rem;line-height:1.4}
.live-note{font-size:.72rem;color:var(--dim);line-height:1.5;margin-top:.9rem}

/* drawer */
.ovl{position:fixed;inset:0;background:rgba(19,19,15,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.ovl.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:-480px;width:min(460px,92vw);height:100%;background:var(--paper);z-index:61;
  transition:right .28s cubic-bezier(.2,.8,.25,1);box-shadow:-18px 0 50px rgba(19,19,15,.15);display:flex;flex-direction:column}
.drawer.open{right:0}
.dr-h{padding:1.3rem 1.5rem 1rem;border-bottom:1px solid var(--line)}
.dr-close{position:absolute;top:1rem;right:1rem;background:var(--paper-2);border:1px solid var(--line);border-radius:50%;
  width:32px;height:32px;font-size:1rem;cursor:pointer;font-family:inherit}
.dr-b{padding:1.2rem 1.5rem;overflow-y:auto;flex:1}
.dr-sec{margin-bottom:1.4rem}
.dr-sec h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;margin-bottom:.6rem}
.meter{height:10px;background:var(--paper-2);border-radius:99px;overflow:hidden;margin:.4rem 0}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#D97706,#DC2626)}
.sig{display:flex;gap:.55rem;align-items:flex-start;padding:.45rem 0;font-size:.84rem;border-bottom:1px solid var(--line-2)}
.sig:last-child{border:none}
.sig .b{width:7px;height:7px;border-radius:50%;margin-top:.42rem;flex-shrink:0}
.dr-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem .9rem;font-size:.83rem}
.dr-grid .k{color:var(--muted)}.dr-grid .v{font-weight:600;text-align:right}
.dr-narr{background:var(--lime-soft);border:1px solid var(--lime-line);border-radius:12px;padding:.9rem 1rem;font-size:.84rem;line-height:1.55}
.dr-foot{padding:1rem 1.5rem;border-top:1px solid var(--line);display:flex;gap:.6rem}
.dr-foot .btn{flex:1;justify-content:center}
.btn-danger{background:var(--red);color:#fff;border:none}
.btn-danger:hover{background:#b91c1c}

/* toast */
.toast{position:fixed;bottom:1.4rem;left:50%;transform:translate(-50%,80px);background:var(--ink);color:#fff;
  padding:.75rem 1.3rem;border-radius:var(--r-pill);font-size:.86rem;font-weight:600;z-index:70;transition:transform .3s;box-shadow:var(--shadow-lg)}
.toast.show{transform:translate(-50%,0)}

/* chat extras */
.chat-resp .src{display:block;margin-top:.7rem;font-size:.7rem;color:var(--dim);font-weight:600}
.chat-resp ul{margin:.4rem 0 .4rem 1.1rem}
.status.live{background:var(--red-soft);color:var(--red);border-color:#f2c4c4}
.status.live .dot{background:var(--red);box-shadow:0 0 0 3px rgba(220,38,38,.15);animation:pulse 1.2s infinite}

@media(max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
@media(max-width:560px){.kpis{grid-template-columns:1fr}.mini{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav"><div class="nav-inner">
  <a class="brand" href="/"><span class="brand-mark"></span><span class="brand-word">Ramp<b style="color:var(--lime-deep)">Agent</b></span></a>
  <span class="nav-tag">Risk OS</span>
  <div class="nav-links">
    <a class="nav-link" href="/">Overview</a>
    <a class="nav-link active" href="/dashboard.html">Dashboard</a>
  </div>
  <div class="nav-spacer"></div>
  <div class="nav-right">
    <a class="btn btn-ghost btn-sm" href="https://github.com/Aditya-00a/RampAgent" target="_blank" rel="noopener">View code ↗</a>
    <a class="btn btn-ink btn-sm" href="/">← Home</a>
  </div>
</div></nav>

<div class="page" id="app">
  <div class="loading" id="loading"><div class="spinner"></div><br>Loading risk analysis…</div>
</div>

<!-- DRAWER + TOAST -->
<div class="ovl" id="ovl" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" aria-label="Transaction detail"></aside>
<div class="toast" id="toast"></div>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-inner">
    <div>
      <a class="brand" href="/"><span class="brand-mark"></span><span class="brand-word">RampAgent</span></a>
      <p class="footer-tag">Continuous risk &amp; controls monitoring for corporate spend — AI-driven and audit-ready.</p>
    </div>
    <div><h5>Product</h5><a href="/dashboard.html">Dashboard</a><a href="/dashboard.html#register">Risk register</a><a href="/dashboard.html#controls">Controls (CCM)</a></div>
    <div><h5>Resources</h5><a href="/">Overview</a><a href="https://github.com/Aditya-00a/RampAgent" target="_blank" rel="noopener">View code ↗</a></div>
  </div>
  <div class="footer-bottom"><div class="container">
    <span>Built by Aditya Sakhale</span><span>Demo · synthetic data</span>
  </div></div>
</footer>

<script>
const RISKCOLOR={CRITICAL:'#DC2626',HIGH:'#D97706',MEDIUM:'#2563EB',LOW:'#16A34A'};
const AV=['#13130f','#7c3aed','#0891b2','#db2777','#ea580c','#16a34a','#2563eb'];
let DATA=null,FLAGMAP=new Map();
const SESSION_EVENTS=[];

function fmt(n){if(n==null)return '$0';return n>=1000?'$'+Math.round(n).toLocaleString('en-US'):'$'+(+n).toFixed(0)}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function initials(n){return (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function tagc(l){return 'tag tag-'+(l||'low').toLowerCase()}

(async function(){
  try{
    DATA=await (await fetch('/data/results.json')).json();
    (DATA.flagged_transactions||[]).forEach(t=>FLAGMAP.set(t.transaction_id,t));
    render();
    if(location.hash==='#live') setTimeout(()=>{if(!LIVE.on)toggleLive();},500);
  }
  catch(e){ const l=document.getElementById('loading'); if(l)l.innerHTML='<p style="color:#dc2626">Failed to load data: '+esc(e.message)+'</p>'; }
})();

function ICON(k){return ({
  spend:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5a2.5 2 0 0 1 5 0c0 1.5-5 1-5 3a2.5 2 0 0 0 5 0"/></svg>',
  exp:'<svg viewBox="0 0 24 24"><path d="M10.3 3.3a2 2 0 0 1 3.4 0l7.3 12.6a2 2 0 0 1-1.7 3H4.7a2 2 0 0 1-1.7-3z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12" y2="17"/></svg>',
  loss:'<svg viewBox="0 0 24 24"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>',
  crit:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12" y2="16"/></svg>',
  ctrl:'<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>'})[k]}

function deltaHTML(key){
  const t=DATA.trends&&DATA.trends.available&&DATA.trends.metrics&&DATA.trends.metrics[key];
  if(!t)return '<span class="d d-muted">vs prior period</span>';
  let cls='d-muted'; if(t.good===true)cls='d-green'; else if(t.good===false)cls='d-red'; else cls=(t.direction==='down'?'d-green':'d-muted');
  const ar=t.direction==='up'?'↑':(t.direction==='down'?'↓':'→');
  return `<span class="d ${cls}">${ar} ${Math.abs(t.delta_pct).toFixed(1)}% vs prior ${DATA.trends.period_days}d</span>`;
}

function kpi(ic,iccls,label,value,key){
  return `<div class="kpi"><div class="l"><span class="ic ${iccls}">${ICON(ic)}</span>${label}</div>
    <div class="v">${value}</div>${deltaHTML(key)}</div>`;
}

function render(){
  const s=DATA.summary, crit=(DATA.risk_distribution&&DATA.risk_distribution.CRITICAL)||0;
  document.getElementById('app').innerHTML=`
  <div class="phead">
    <div><h1>Risk &amp; Controls</h1><div class="sub">Continuous monitoring across ${s.total_transactions} transactions · ${fmt(s.total_spend)} screened</div></div>
    <div class="phead-right">
      <span class="period"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Current period</span>
      <span class="status" id="status-pill"><span class="dot"></span><span id="status-txt">Monitoring active</span></span>
      <button class="btn btn-ink btn-sm" id="live-btn" onclick="toggleLive()">▶&nbsp; Go live</button>
    </div>
  </div>

  <div class="tabbar">
    <button class="tabbtn active" data-t="overview" onclick="tab('overview',this)">Overview</button>
    <button class="tabbtn" data-t="live" onclick="tab('live',this)">Live Monitor<span id="live-tab-dot" style="display:none" class="live-dot"></span></button>
    <button class="tabbtn" data-t="register" onclick="tab('register',this)">Risk Register</button>
    <button class="tabbtn" data-t="controls" onclick="tab('controls',this)">Controls</button>
    <button class="tabbtn" data-t="activity" onclick="tab('activity',this)">Activity</button>
  </div>

  <!-- OVERVIEW -->
  <section class="tabpane active" id="tp-overview">
    <div class="kpis">
      ${kpi('spend','ic-ink','Spend monitored',fmt(s.total_spend),'total_spend')}
      ${kpi('exp','ic-red','Exposure at risk',fmt(s.flagged_exposure||0),'flagged_exposure')}
      ${kpi('loss','ic-amber','Expected loss',fmt(s.expected_loss||0),'expected_loss')}
      ${kpi('crit','ic-red','Critical risks',crit,'critical_count')}
      ${kpi('ctrl','ic-lime','Control exceptions',s.flagged_count,'control_exceptions')}
    </div>
    <div class="grid-2">
      <div class="panel">
        <div class="panel-h"><h3>Risk exposure trend</h3><span class="hint">weekly</span></div>
        <div class="panel-b"><div class="panel-desc">Flagged exposure (bars) vs. probability-weighted expected loss (line), by week.</div>
          <div id="trend" style="height:280px"></div></div>
      </div>
      <div class="panel">
        <div class="panel-h"><h3>Key risk indicators</h3><span class="hint">vs. appetite</span></div>
        <div class="panel-b"><div id="kris"></div></div>
      </div>
    </div>
    <div class="grid-1 panel">
      <div class="panel-h"><h3>Top risk events</h3><span class="hint">highest score</span></div>
      <div class="panel-b"><div class="panel-desc">Transactions where one or more controls raised an exception, ranked by risk score.</div>
        <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Item</th><th>Issue</th><th>Exposure</th><th>Severity</th><th style="text-align:right">Action</th></tr></thead><tbody id="watch"></tbody></table></div></div>
    </div>
  </section>

  <!-- LIVE MONITOR -->
  <section class="tabpane" id="tp-live">
    <div class="grid-2">
      <div class="panel">
        <div class="panel-h"><h3>Incoming transactions</h3><span class="hint" id="feed-hint">press ▶ Go live</span></div>
        <div class="panel-b">
          <div class="panel-desc">Every swipe is screened in real time — anomaly ensemble, policy tests, duplicate &amp; velocity checks. Click a flagged item for the full evidence trail.</div>

const LIVE={on:false,timer:null,i:0,stream:[],screened:0,flagged:0,exposure:0,seq:0};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildStream(){
  const r=mulberry32(41),arr=[...(DATA.all_transactions||[])];
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
  return arr;
}
function toggleLive(){
  const btn=document.getElementById('live-btn'),pill=document.getElementById('status-pill'),
        txt=document.getElementById('status-txt'),dot=document.getElementById('live-tab-dot');
  if(LIVE.on){
    LIVE.on=false;clearInterval(LIVE.timer);
    btn.innerHTML='▶&nbsp; Go live';pill.classList.remove('live');txt.textContent='Monitoring active';dot.style.display='none';
    document.getElementById('feed-hint').textContent='paused';
    return;
  }
  if(!LIVE.stream.length)LIVE.stream=buildStream();
  LIVE.on=true;
  btn.innerHTML='■&nbsp; Stop';pill.classList.add('live');txt.textContent='Live · screening feed';dot.style.display='inline-block';
  document.getElementById('feed-hint').textContent='streaming';
  tab('live');
  const first=document.querySelector('#feed p'); if(first)first.remove();
  tick(); LIVE.timer=setInterval(tick,1900);
}
function tick(){
  if(LIVE.i>=LIVE.stream.length)LIVE.i=0;
  pushCard(LIVE.stream[LIVE.i++]);
}
function pushCard(tx,injected){
  const feed=document.getElementById('feed'),id='fc-'+(++LIVE.seq);
  const full=FLAGMAP.get(tx.transaction_id)||tx;
  const el=document.createElement('div');
  el.className='feed-card'+(injected?' injected':'');el.id=id;
  el.innerHTML=`<div class="fc-left"><span class="item-ic">${esc(initials(tx.vendor))}</span>
      <div><div class="fc-vendor">${esc(tx.vendor)}${injected?' <span class="tag tag-medium" style="font-size:.62rem;vertical-align:1px">INJECTED</span>':''}</div>
      <div class="fc-meta">${esc(tx.employee_name||'—')} · ${esc(tx.category||'')}</div></div></div>
    <div class="fc-right"><div class="fc-amt">${fmt(tx.amount)}</div>
      <div class="fc-status"><span class="spin-sm"></span>Screening…</div></div>`;
  feed.prepend(el);
  [...feed.children].slice(9).forEach(c=>{c.classList.add('gone');setTimeout(()=>c.remove(),380);});
  setTimeout(()=>resolveCard(el,full,injected),injected?900:650);
}
function resolveCard(el,tx,injected){
  if(!document.getElementById(el.id))return;
  const st=el.querySelector('.fc-status');
  const isFlag=FLAGMAP.has(tx.transaction_id)||tx._injected;
  LIVE.screened++;
  if(isFlag){
    LIVE.flagged++;LIVE.exposure+=tx.amount;
    el.classList.add('flagged');
    el.onclick=()=>openDrawer(tx.transaction_id);
    st.innerHTML=`<span class="${tagc(tx.risk_level)}">${tx.risk_level}</span>`;
    st.insertAdjacentHTML('afterend',`<div class="fc-reason">${esc(issueOf(tx))}</div>`);
    if(injected){
      logEvent(esc(tx.vendor)+' · '+fmt(tx.amount)+' — injected scenario caught','flag','AI Agent');
      showToast('Caught in 0.9s — now at the top of the review queue');
    }
  }else{
    st.innerHTML='<span style="color:var(--green)">✓ Cleared</span>';
  }
  bump('ls-screened',LIVE.screened);bump('ls-flagged',LIVE.flagged);bump('ls-exposure',fmt(LIVE.exposure));
}
function bump(id,val){const n=document.getElementById(id);if(!n)return;n.textContent=val;n.classList.remove('bump');void n.offsetWidth;n.classList.add('bump');}

        <span class="k">Department</span><span class="v">${esc(t.department||'—')}</span>
        <span class="k">Category</span><span class="v">${esc(t.category||'—')}</span>
        <span class="k">Receipt attached</span><span class="v">${t.receipt_attached?'Yes':'No'}</span>
        <span class="k">Pre-approved</span><span class="v">${t.pre_approved?'Yes':'No'}</span>
        <span class="k">Status</span><span class="v">${t._status||'Open'}</span>
      </div></div>
    </div>
    <div class="dr-foot">
      <button class="btn btn-danger" onclick="actOn('${t.transaction_id}','BLOCKED');closeDrawer()">Block transaction</button>
      <button class="btn btn-ghost" onclick="actOn('${t.transaction_id}','REVIEWED');closeDrawer()">Mark reviewed</button>
    </div>`;
  dr.classList.add('open');document.getElementById('ovl').classList.add('open');
}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('ovl').classList.remove('open');}
function actOn(id,status){
  const t=FLAGMAP.get(id); if(!t||t._status)return;
  t._status=status;
  logEvent(esc(t.vendor)+' · '+fmt(t.amount)+(status==='BLOCKED'?' blocked':' marked reviewed'),status==='BLOCKED'?'block':'review','You');
  renderWatch();renderQueue();
  showToast(status==='BLOCKED'?'Transaction blocked — evidence written to the audit log':'Marked reviewed — evidence written to the audit log');
}
let TOAST_T=null;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(TOAST_T);TOAST_T=setTimeout(()=>t.classList.remove('show'),3200);
}

/* ============ AI ANALYST ============ */
function mdlite(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .split(/\n/).map(l=>l.trim()).filter(Boolean)
    .map(l=>/^[-*•]\s/.test(l)?'<li>'+l.replace(/^[-*•]\s/,'')+'</li>':'<p style="margin:.3rem 0">'+l+'</p>')
    .join('').replace(/(<li>.*?<\/li>)+/g,m=>'<ul>'+m+'</ul>');
}
function localAnalyst(q){
  if(!DATA||!DATA.summary)return 'Data is still loading — try again in a moment.';
  const s=DATA.summary,lq=q.toLowerCase();
  const worst=[...(DATA.controls||[])].sort((a,b)=>b.exception_rate-a.exception_rate)[0]||{control_id:'—',control_name:'—',exceptions:0,tested:0,exception_rate:0,exposure:0,effectiveness:'—'};
  const reg=[...(DATA.risk_register||[])].sort((a,b)=>b.exposure-a.exposure);
  if(!reg.length)reg.push({risk_id:'—',risk_name:'—',exposure:0,events:0,rating:'—'});
  const crit=(DATA.flagged_transactions||[]).filter(t=>t.risk_level==='CRITICAL');
  if(/(largest|biggest|top|where).*(exposure|risk)|exposure.*(largest|biggest|where)/.test(lq)){
    const byV={};(DATA.flagged_transactions||[]).forEach(t=>byV[t.vendor]=(byV[t.vendor]||0)+t.amount);
    const tv=Object.entries(byV).sort((a,b)=>b[1]-a[1]).slice(0,3);
    return `The largest concentration is **${reg[0].risk_name}** (${reg[0].risk_id}): ${fmt(reg[0].exposure)} across ${reg[0].events} events, rated **${reg[0].rating}**.\nTop vendors by flagged exposure:\n${tv.map(([v,a])=>`- ${v} — ${fmt(a)}`).join('\n')}\nTotal flagged exposure is **${fmt(s.flagged_exposure)}** (${s.exposure_rate.toFixed(1)}% of monitored spend); probability-weighted expected loss is **${fmt(s.expected_loss)}**.`;
  }
  if(/control/.test(lq)&&/(least|worst|ineffective|weak|effective)/.test(lq)){
    return `**${worst.control_id} · ${worst.control_name}** is the weakest control: ${worst.exceptions} exceptions out of ${worst.tested} tested (a **${worst.exception_rate.toFixed(1)}%** exception rate, ${fmt(worst.exposure)} exposure), rated **${worst.effectiveness}**.\nA control failing this often usually means the policy limit is set below real spending behavior — recommend recalibrating the limit or adding an approval step rather than treating each event as an exception.`;
  }
  if(/critical/.test(lq)){
    const top=crit.slice(0,3);
    return `There are **${crit.length} critical risk events** carrying ${fmt(s.critical_exposure)} of exposure. The highest-scoring:\n${top.map(t=>`- ${t.vendor} — ${fmt(t.amount)} (${issueOf(t)})`).join('\n')}\nRecommend clearing the review queue for critical items first; they drive ${(s.critical_exposure/s.flagged_exposure*100).toFixed(0)}% of flagged exposure.`;
  }
  if(/(who|employee|person)/.test(lq)){
    const ei=DATA.executive_insights||{};
    return `**${ei.highest_risk_employee}** has the most flagged activity (${ei.highest_risk_employee_flags} exceptions). The riskiest category is **${ei.highest_risk_category}** — ${ei.highest_risk_category_flags} flags on ${fmt(ei.highest_risk_category_spend)} of spend.`;
  }
  return `Across **${s.total_transactions} transactions** (${fmt(s.total_spend)}), the agent flagged **${s.flagged_count}** exceptions — ${fmt(s.flagged_exposure)} of exposure, ${fmt(s.expected_loss)} expected loss.\n- Largest risk: **${reg[0].risk_name}** (${fmt(reg[0].exposure)}, ${reg[0].rating})\n- Weakest control: **${worst.control_name}** (${worst.exception_rate.toFixed(1)}% exception rate)\n- Critical events: **${crit.length}**\nAsk about exposure, controls, critical risks, or specific employees.`;
}
function askQ(b){document.getElementById('chat-in').value=b.textContent;ask();}
async function ask(){
  const inp=document.getElementById('chat-in'),btn=document.getElementById('chat-btn'),resp=document.getElementById('chat-resp');
  const q=inp.value.trim(); if(!q||btn.disabled)return;
  btn.disabled=true;btn.textContent='Thinking…';resp.style.display='block';resp.textContent='Analyzing…';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q}),signal:AbortSignal.timeout(15000)});
    const d=await r.json();
    if(!r.ok||!d.answer)throw new Error(d.error||'no answer');
    resp.innerHTML=mdlite(d.answer)+'<span class="src">Llama 3.1 · Cerebras · grounded in this dashboard’s data</span>';
  }catch(e){
    resp.innerHTML=mdlite(localAnalyst(q))+'<span class="src">Deterministic analysis computed from the loaded dataset (LLM endpoint unavailable)</span>';
  }
  btn.disabled=false;btn.textContent='Ask';
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeDrawer();
  if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='chat-in')ask();
});
</script>
