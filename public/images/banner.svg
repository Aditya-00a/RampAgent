<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ramp finance dashboard illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf7c9"/>
      <stop offset="0.5" stop-color="#d8fe51"/>
      <stop offset="1" stop-color="#bfe3c9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f8f2"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <circle cx="250" cy="120" r="220" fill="#ffffff" opacity="0.16"/>
  <circle cx="1380" cy="470" r="300" fill="#13130f" opacity="0.05"/>
  <circle cx="1500" cy="90" r="60" fill="#13130f" opacity="0.08"/>
  <!-- dashboard card -->
  <g transform="translate(560 120)">
    <rect x="0" y="0" width="640" height="320" rx="22" fill="url(#card)" stroke="#13130f" stroke-opacity="0.06"/>
    <rect x="28" y="28" width="150" height="14" rx="7" fill="#13130f" opacity="0.8"/>
    <rect x="28" y="54" width="90" height="10" rx="5" fill="#13130f" opacity="0.25"/>
    <!-- kpi pills -->
    <rect x="28" y="86" width="120" height="56" rx="12" fill="#f1fbd2" stroke="#c4f02f" stroke-opacity="0.5"/>
    <rect x="160" y="86" width="120" height="56" rx="12" fill="#f5f6f0"/>
    <rect x="292" y="86" width="120" height="56" rx="12" fill="#f5f6f0"/>
    <!-- bars -->
    <g transform="translate(28 270)">
      <rect x="0"   y="-70"  width="34" height="70"  rx="6" fill="#13130f" opacity="0.85"/>
      <rect x="48"  y="-110" width="34" height="110" rx="6" fill="#c4f02f"/>
      <rect x="96"  y="-58"  width="34" height="58"  rx="6" fill="#13130f" opacity="0.85"/>
      <rect x="144" y="-130" width="34" height="130" rx="6" fill="#c4f02f"/>
      <rect x="192" y="-92"  width="34" height="92"  rx="6" fill="#13130f" opacity="0.85"/>
      <rect x="240" y="-150" width="34" height="150" rx="6" fill="#c4f02f"/>
      <rect x="288" y="-104" width="34" height="104" rx="6" fill="#13130f" opacity="0.85"/>
    </g>
    <!-- mini donut -->
    <g transform="translate(470 175)">
      <circle r="78" fill="none" stroke="#eef0e8" stroke-width="22"/>
      <circle r="78" fill="none" stroke="#c4f02f" stroke-width="22" stroke-dasharray="300 490" stroke-linecap="round" transform="rotate(-90)"/>
      <circle r="46" fill="#ffffff"/>
    </g>
  </g>
</svg>
